name: Build APK with Briefcase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Briefcase and Dependencies
        run: |
          pip install briefcase
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Build APK
        run: |
          # Инициализируем проект (Briefcase создаст нужные файлы)
          briefcase new --no-input --app-name "Умный конспект" --author "Ilya" --bundle "org.smartnotes" --description "Умный конспект"
          
          # Собираем APK для Android
          briefcase package android --no-input

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-notes-apk
          path: android/gradle/app/build/outputs/apk/debug/*.apk
