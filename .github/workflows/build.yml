name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Устанавливаем системные зависимости и Java
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libstdc++6

      - name: Install Buildozer
        run: |
          pip install --upgrade buildozer Cython virtualenv

      # ГЛАВНЫЙ ФИКС: Принудительно ставим build-tools и добавляем aidl в PATH
      - name: Setup Android Build Tools
        run: |
          # Путь к sdkmanager внутри buildozer
          SDKMANAGER=$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          
          # Принимаем лицензии
          yes | $SDKMANAGER --licenses || true
          
          # Устанавливаем build-tools (там лежит правильный aidl)
          $SDKMANAGER "build-tools;34.0.0" || true
          
          # Добавляем папку с aidl в PATH для следующих шагов
          echo "$HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Build with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          export BUILDOZER_WARN_ON_ROOT=0
          # Запускаем сборку, автоматически отвечая "да" на все вопросы
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-notes-apk
          path: bin/*.apk
