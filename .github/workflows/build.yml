name: Build APK

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build-android:
runs-on: ubuntu-22.04
timeout-minutes: 60

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.9'
      cache: pip

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install system dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip \
        autoconf libtool pkg-config \
        zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
        cmake libffi-dev libssl-dev \
        libltdl-dev

  - name: Cache Buildozer downloads
    uses: actions/cache@v4
    with:
      path: ~/.buildozer
      key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec', '.github/workflows/build.yml') }}
      restore-keys: |
        ${{ runner.os }}-buildozer-

  - name: Cache Gradle
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      restore-keys: |
        ${{ runner.os }}-gradle-

  - name: Install Python build tools
    run: |
      python -m pip install --upgrade pip
      python -m pip install buildozer==1.5.0 Cython==0.29.33 virtualenv

  - name: Check project files
    run: |
      test -f main.py
      test -f buildozer.spec

  - name: Build APK
    env:
      APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
      BUILDOZER_WARN_ON_ROOT: "0"
    run: |
      buildozer android debug

  - name: Verify APK
    run: |
      find bin -maxdepth 1 -type f -name "*.apk" -print
      test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: smartnotes-debug-apk
      path: bin/*.apk
      if-no-files-found: error
      retention-days: 7
