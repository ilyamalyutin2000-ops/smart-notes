name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Ставим Python 3.10 (Buildozer будет использовать его)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 2. Ставим Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Системные зависимости
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libstdc++6

      # 4. Устанавливаем Buildozer
      - name: Install Buildozer
        run: |
          pip install --upgrade buildozer Cython virtualenv

      # 5. ГЛАВНЫЙ ФИКС ДЛЯ AIDL: ставим build-tools и добавляем в PATH
      - name: Setup Android Build Tools
        run: |
          SDKMANAGER=$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "build-tools;34.0.0" || true
          echo "$HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      # 6. Запуск сборки
      - name: Build with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          export BUILDOZER_WARN_ON_ROOT=0
          yes | buildozer android debug

      # 7. Загрузка APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-notes-apk
          path: bin/*.apk
