name: Build APK with Briefcase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Briefcase and Dependencies
        run: |
          pip install briefcase
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Build APK
        run: |
          briefcase package android --no-input

      - name: Find and Upload APK
        run: |
          # Ищем APK файл во всей папке (Briefcase кладет его в разные места)
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK не найден!"
            exit 1
          fi
          echo "Найден APK: $APK_PATH"
          # Копируем его в корень для удобства
          cp "$APK_PATH" ./app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-notes-apk
          path: app-debug.apk
